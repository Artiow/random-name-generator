<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate random, memorable, human-readable Docker-style names for containers, projects, codenames, and more.">
  <title>Random Name Generator — Docker-Style & Human-Readable Names</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: canvas;
      color: canvastext;
    }

    main {
      width: 90vw;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .name {
      width: max-content;
      min-width: min(calc(19ch + 2.5rem), 100%);
      max-width: 100%;
      box-sizing: border-box;
      margin: 2rem 0;
      padding: 1.25rem;
      border: 1px solid color-mix(in srgb, canvastext 25%, transparent);
      border-radius: 0.75rem;
      background: transparent;
      color: inherit;
      font: 600 clamp(1.5rem, 6vw, 3rem) ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
      overflow-wrap: anywhere;
      cursor: pointer;
      appearance: none;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    footer div + div {
      margin-top: 0.4rem;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Name Generator</h1>
    <p>Click the name to generate and copy it.</p>

    <button id="name" class="name" type="button" aria-live="polite"></button>

    <footer>
      <div>
        Source code available on
        <a href="https://github.com/Artiow/random-name-generator">GitHub</a>.
      </div>
      <div>
        Name lists adapted from the
        <a href="https://github.com/moby/moby/blob/624b3cfbe8dc2abfa7f1c44298b4dc184010764f/pkg/namesgenerator/names-generator.go">Moby Project</a>.
      </div>
    </footer>
  </main>

  <script type="module" src="./generator.js"></script>
</body>
</html>
