<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate random, memorable, human-readable Docker-style names for containers, projects, codenames, and more.">
  <title>Random Name Generator — Docker-Style & Human-Readable Names</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: canvas;
      color: canvastext;
    }

    main {
      width: 90vw;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .name-row {
      --copy-size: 3rem;
      --copy-gap: 2rem;

      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 2rem 0;
    }

    .name {
      width: max-content;
      min-width: min(calc(19ch + 2.5rem), 90vw);
      max-width: 90vw;
      box-sizing: border-box;
      padding: 1.25rem;
      border: 1px solid color-mix(in srgb, canvastext 25%, transparent);
      border-radius: 0.75rem;
      background: transparent;
      color: inherit;
      font: 600 clamp(1.5rem, 6vw, 3rem) ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
      overflow-wrap: anywhere;
      cursor: pointer;
      appearance: none;
    }

    .copy {
      position: absolute;
      top: 50%;
      left: calc(100% + var(--copy-gap));
      width: var(--copy-size);
      height: var(--copy-size);
      box-sizing: border-box;
      padding: 0.65rem;
      border: 1px solid color-mix(in srgb, canvastext 25%, transparent);
      border-radius: 0.75rem;
      background: transparent;
      color: inherit;
      cursor: pointer;
      appearance: none;
      transform: translateY(-50%);
    }

    .copy svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .name:active,
    .copy:active {
      box-shadow: inset 0 2px 5px color-mix(in srgb, canvastext 25%, transparent);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    footer div + div {
      margin-top: 0.4rem;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Name Generator</h1>
    <p>Click the name to generate and copy it.</p>

    <div class="name-row">
      <button id="name" class="name" type="button" aria-live="polite">adjective_surname</button>
      <button id="copy" class="copy" type="button" aria-label="Copy current name to clipboard" title="Copy to clipboard">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M 9,1.5 C 8.18,1.5 7.5,2.18 7.5,3 V 3.5 H 6 C 4.63,3.5 3.5,4.63 3.5,6 v 4 A 0.5,0.5 0 0 0 4,10.5 0.5,0.5 0 0 0 4.5,10 V 6 C 4.5,5.17 5.17,4.5 6,4.5 H 7.5 V 5 c 0,0.82 0.68,1.5 1.5,1.5 h 6 c 0.82,0 1.5,-0.68 1.5,-1.5 V 4.5 H 18 c 0.83,0 1.5,0.67 1.5,1.5 v 14 c 0,0.83 -0.67,1.5 -1.5,1.5 H 6 C 5.17,21.5 4.5,20.83 4.5,20 V 18 A 0.5,0.5 0 0 0 4,17.5 0.5,0.5 0 0 0 3.5,18 v 2 c 0,1.37 1.13,2.5 2.5,2.5 h 12 c 1.37,0 2.5,-1.13 2.5,-2.5 V 6 C 20.5,4.63 19.37,3.5 18,3.5 H 16.5 V 3 C 16.5,2.18 15.82,1.5 15,1.5 Z m 0,1 h 6 c 0.29,0 0.5,0.21 0.5,0.5 v 1 1 c 0,0.29 -0.21,0.5 -0.5,0.5 H 9 C 8.71,5.5 8.5,5.29 8.5,5 V 3 C 8.5,2.71 8.71,2.5 9,2.5 Z m 0,7 a 0.5,0.5 0 0 0 -0.35,0.15 0.5,0.5 0 0 0 0,0.7 l 3.14,3.15 H 3 A 0.5,0.5 0 0 0 2.5,14 0.5,0.5 0 0 0 3,14.5 h 8.79 l -3.14,3.15 a 0.5,0.5 0 0 0 0,0.7 0.5,0.5 0 0 0 0.7,0 l 4,-3.99 a 0.5,0.5 0 0 0 0,-0.01 0.5,0.5 0 0 0 0.04,-0.04 0.5,0.5 0 0 0 0.01,-0.01 0.5,0.5 0 0 0 0.05,-0.08 0.5,0.5 0 0 0 0.01,-0.03 0.5,0.5 0 0 0 0.02,-0.06 0.5,0.5 0 0 0 0.02,-0.06 0.5,0.5 0 0 1 0,-0.01 0.5,0.5 0 0 0 0,-0.13 0.5,0.5 0 0 0 -0.02,-0.06 0.5,0.5 0 0 0 -0.03,-0.09 0.5,0.5 0 0 0 -0.02,-0.03 0.5,0.5 0 0 0 -0.03,-0.05 0.5,0.5 0 0 0 -0.01,-0.01 0.5,0.5 0 0 0 -0.04,-0.04 l -4,-4 A 0.5,0.5 0 0 0 9,9.5 Z" fill="currentColor" opacity=".7"/>
        </svg>
      </button>
    </div>

    <footer>
      <div>
        Source code available on
        <a href="https://github.com/Artiow/random-name-generator">GitHub</a>.
      </div>
      <div>
        Name lists adapted from the
        <a href="https://github.com/moby/moby/blob/624b3cfbe8dc2abfa7f1c44298b4dc184010764f/pkg/namesgenerator/names-generator.go">Moby Project</a>.
      </div>
    </footer>
  </main>

  <script type="module" src="./generator.js"></script>
</body>
</html>
